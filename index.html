<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent Atlas</title>
<meta name="description" content="A bilingual (中文 / English) roadmap for learning LLM agents: from foundations to frontier research, with verified resources, a paper timeline and a project ladder.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --surface-2:#EEF1EC; --ink:#151A1E; --muted:#5B6670; --line:#D6DCD8; --line-soft:#E6EAE6;
  --accent:#1E6B4F; --accent-ink:#175640; --accent-soft:#DDEEE5; --accent-2:#3E5A8C; --accent-2-soft:#E1E8F4;
  --pin:#B4641E; --pin-soft:#F7E8D8; --l1:#7FA394; --l2:#1E6B4F; --l3:#0F3D2C; --done:#2E7D4F;
  --job:#3E5A8C; --research:#7A4E9A;
  --shadow:0 1px 2px rgba(21,26,30,.05),0 10px 30px -18px rgba(21,26,30,.28);
  --display:"Sora","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Source Sans 3","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171D1A; --surface-2:#1F2622; --ink:#E7ECE8; --muted:#97A39C; --line:#2B3530; --line-soft:#222B26;
  --accent:#5FC199; --accent-ink:#8ED9B8; --accent-soft:#173226; --accent-2:#8FA9DC; --accent-2-soft:#1D2739;
  --pin:#E2A05E; --pin-soft:#33261A; --l1:#7FA394; --l2:#5FC199; --l3:#B9E6D0; --done:#7BD19E; --job:#8FA9DC; --research:#C39BE0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171D1A; --surface-2:#1F2622; --ink:#E7ECE8; --muted:#97A39C; --line:#2B3530; --line-soft:#222B26;
  --accent:#5FC199; --accent-ink:#8ED9B8; --accent-soft:#173226; --accent-2:#8FA9DC; --accent-2-soft:#1D2739;
  --pin:#E2A05E; --pin-soft:#33261A; --l1:#7FA394; --l2:#5FC199; --l3:#B9E6D0; --done:#7BD19E; --job:#8FA9DC; --research:#C39BE0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding-block:0 96px;padding-inline:20px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.top .in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.topnav{display:flex;gap:2px 14px;flex-wrap:wrap;font-size:14px;margin-left:auto}
.topnav a{color:var(--muted);border:0}
.topnav a:hover{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){.topnav{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:40px;align-items:end;padding:56px 0 36px;border-bottom:1px solid var(--line)}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:24px;padding-top:36px}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-size:clamp(36px,5.2vw,60px);line-height:1.02;margin:10px 0 16px;font-weight:700}
h1 span{color:var(--accent)}
.lede{font-size:18px;color:var(--muted);max-width:56ch;margin:0 0 22px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px}
.stat b{font-family:var(--display);font-size:26px;font-weight:600;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.panel h4{margin:0 0 10px;font-size:14px;font-weight:600}
.prog .num{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tracks{display:grid;gap:8px;margin-top:8px}
.track{text-align:left;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;border:1px solid var(--line-soft);cursor:pointer;font-size:14px;background:var(--surface)}
.track[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.track i{width:10px;height:10px;border-radius:50%;margin-top:7px;display:block}
.track b{display:block;font-weight:600}
.track span{color:var(--muted);font-size:13px}

/* sections */
section.sec{padding-top:56px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:8px}
.sec-h h2{font-size:30px;margin:0;font-weight:600}
.sec-h .k{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sec-p{color:var(--muted);max-width:72ch;margin:0 0 22px}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 22px;background:var(--bg);padding:8px 0}
@media (min-width:900px){.controls{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:10}}
.controls .lbl{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.pin[aria-pressed="true"]{background:var(--pin);border-color:var(--pin)}
.sep{width:1px;height:20px;background:var(--line)}

/* landscape */
.atlas{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px}
@media (max-width:760px){.atlas{grid-template-columns:1fr}}
.layer{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:640px){.layer{grid-template-columns:1fr}}
.layer .ln{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.nodes{display:flex;flex-wrap:wrap;gap:8px}
.node{display:inline-block;padding:6px 11px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:500;border:1px solid transparent}
.node:hover{border-color:var(--accent)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-self:stretch;border-left:4px solid var(--accent-2)}
.side .ln{font-family:var(--mono);font-size:12px;color:var(--muted)}
.side .node{background:var(--accent-2-soft);color:var(--accent-2)}
.arrow{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin:-4px 0 6px}

/* stages */
.stage{margin-top:40px}
.stage-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-top:2px solid var(--ink);padding-top:12px}
.stage-h h3{font-size:24px;margin:0;font-weight:600}
.stage-h .wk{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stage-h p{width:100%;margin:2px 0 0;color:var(--muted);font-size:15px;max-width:80ch}
.module{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-top:18px;box-shadow:var(--shadow)}
@media (max-width:600px){.module{padding:16px}}
.mod-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:baseline}
.mod-h h4{font-size:21px;margin:0;font-weight:600}
.mod-h .en{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mod-h .mp{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.tr{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line)}
.tr.job{color:var(--job);border-color:var(--job)}
.tr.research{color:var(--research);border-color:var(--research)}
.why{margin:10px 0 14px;max-width:78ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:14px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.box h5{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
.box ul{margin:0;padding-left:18px;font-size:14.5px}
.box li{margin:3px 0}
.box.q li{font-style:italic}
.open{background:var(--accent-2-soft);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.open h5{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2);margin:0 0 4px;font-weight:500}
.open ul{margin:0;padding-left:18px}
.tier{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:10px}
.tier.empty{display:none}
.tier-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.tier-h .dot{width:10px;height:10px;border-radius:50%}
.tier-h b{font-size:13px;font-weight:600}
.tier-h span{font-size:12.5px;color:var(--muted)}
.res{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 10px;padding:7px 0;align-items:start}
.res + .res{border-top:1px dashed var(--line-soft)}
.res input{margin:5px 0 0;width:16px;height:16px;accent-color:var(--done);cursor:pointer}
.res .t{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.res .t a{font-weight:500}
.res.done .t a{color:var(--muted);text-decoration:line-through}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:1.6}
.tag.h{border:0;padding:0}
.tag.pin{color:var(--pin);border-color:var(--pin);background:var(--pin-soft)}
.tag.zh{color:var(--accent-2);border-color:var(--accent-2)}
.res .w{font-size:13.5px;color:var(--muted);margin:1px 0 0}
.task{margin-top:14px;background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:14.5px}
.task b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:4px;font-weight:500}
.module.dim{opacity:.55}

/* timeline */
.tl-ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tl{position:relative;padding-left:0}
.year{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line-soft)}
@media (max-width:600px){.year{grid-template-columns:1fr;gap:4px}}
.year .y{font-family:var(--display);font-size:28px;font-weight:600;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.year .y small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}
.paper{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:6px 0;align-items:baseline}
.paper + .paper{border-top:1px dashed var(--line-soft)}
.paper .d{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.paper .pt{font-weight:500}
.paper .pa{font-size:12.5px;color:var(--muted);margin-left:6px}
.paper .pw{font-size:13.5px;color:var(--muted);margin:1px 0 0}
.area{font-family:var(--mono);font-size:10.5px;padding:0 5px;border-radius:3px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:middle}
.paper[hidden]{display:none}
.year.empty{display:none}

/* projects */
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rung{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.rung .lv{font-family:var(--mono);font-size:11.5px;color:var(--pin);letter-spacing:.04em}
.rung h4{margin:0;font-size:18px;font-weight:600}
.rung p{margin:0;font-size:14.5px}
.rung .learn{color:var(--muted);font-size:13.5px}
.rung .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.rung .links a{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted)}

/* research path */
.steps{counter-reset:s;display:grid;gap:8px;max-width:78ch;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:baseline;font-size:15.5px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:600;color:var(--accent);font-size:20px}

/* checklist */
.check{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;box-shadow:var(--shadow)}
.check ul{margin:0;padding:0;list-style:none}
.check li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line-soft);font-size:15px}
.check li:first-child{border-top:0}
.check input{margin:4px 0 0;width:16px;height:16px;accent-color:var(--done)}

.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);max-width:80ch}
.foot a{color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
[data-lang="zh"] .en-only,[data-lang="en"] .zh-only{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="brand" href="#top"><i></i>Agent Atlas</a>
  <nav class="topnav" aria-label="sections">
    <a href="#how" data-i="nav_how"></a><a href="#map" data-i="nav_map"></a><a href="#path" data-i="nav_path"></a><a href="#papers" data-i="nav_papers"></a><a href="#projects" data-i="nav_projects"></a><a href="#research" data-i="nav_research"></a><a href="#check" data-i="nav_check"></a>
  </nav>
  <div class="seg" id="langSeg" role="group" aria-label="language"><button data-lang="zh">中文</button><button data-lang="en">English</button></div>
</div></div>

<div class="wrap" id="top">
  <header class="hero">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="title"></h1>
      <p class="lede" data-i="lede"></p>
      <div class="stats">
        <div class="stat"><b id="sMods">0</b><span data-i="st_mods"></span></div>
        <div class="stat"><b id="sRes">0</b><span data-i="st_res"></span></div>
        <div class="stat"><b id="sPapers">0</b><span data-i="st_papers"></span></div>
        <div class="stat"><b id="sMust">0 h</b><span data-i="st_must"></span></div>
      </div>
    </div>
    <div class="panel prog">
      <h4 data-i="prog_h"></h4>
      <div class="num"><span id="pDone"></span><span id="pHours"></span></div>
      <div class="bar"><i id="pBar"></i></div>
      <h4 data-i="track_h" style="margin-top:6px"></h4>
      <div class="tracks" id="trackSel">
        <button class="track" data-track="both"><i style="background:var(--accent)"></i><div><b data-i="tr_both"></b><span data-i="tr_both_d"></span></div></button>
        <button class="track" data-track="job"><i style="background:var(--job)"></i><div><b data-i="tr_job"></b><span data-i="tr_job_d"></span></div></button>
        <button class="track" data-track="research"><i style="background:var(--research)"></i><div><b data-i="tr_research"></b><span data-i="tr_research_d"></span></div></button>
      </div>
    </div>
  </header>

  <section class="sec" id="how">
    <div class="sec-h"><span class="k">01</span><h2 data-i="how_h"></h2></div>
    <div class="cols" style="margin-bottom:0">
      <div><p class="sec-p" data-i="how_p1"></p><p class="sec-p" data-i="how_p2"></p></div>
      <div><p class="sec-p" data-i="how_p3"></p><p class="sec-p" data-i="how_p4"></p></div>
    </div>
  </section>

  <section class="sec" id="map">
    <div class="sec-h"><span class="k">02</span><h2 data-i="map_h"></h2></div>
    <p class="sec-p" id="mapIntro"></p>
    <div class="atlas"><div id="layers"></div><div class="side" id="sideLayer"></div></div>
  </section>

  <section class="sec" id="path">
    <div class="sec-h"><span class="k">03</span><h2 data-i="path_h"></h2></div>
    <p class="sec-p" data-i="path_p"></p>
    <div class="controls" id="controls">
      <span class="lbl" data-i="filter"></span>
      <button class="chip pin" data-f="must" aria-pressed="false" data-i="f_must"></button>
      <span class="sep"></span>
      <button class="chip" data-f="level:intro" aria-pressed="false" data-i="lv_intro"></button>
      <button class="chip" data-f="level:core" aria-pressed="false" data-i="lv_core"></button>
      <button class="chip" data-f="level:deep" aria-pressed="false" data-i="lv_deep"></button>
      <span class="sep"></span>
      <button class="chip" data-f="type:official" aria-pressed="false" data-i="t_official"></button>
      <button class="chip" data-f="type:course" aria-pressed="false" data-i="t_course"></button>
      <button class="chip" data-f="type:video" aria-pressed="false" data-i="t_video"></button>
      <button class="chip" data-f="type:blog" aria-pressed="false" data-i="t_blog"></button>
      <button class="chip" data-f="type:paper" aria-pressed="false" data-i="t_paper"></button>
      <button class="chip" data-f="type:code" aria-pressed="false" data-i="t_code"></button>
      <button class="chip" data-f="type:book" aria-pressed="false" data-i="t_book"></button>
      <span class="sep"></span>
      <button class="chip" data-f="lang:zh" aria-pressed="false" data-i="f_zh"></button>
      <button class="chip" data-f="hideDone" aria-pressed="false" data-i="f_hide"></button>
    </div>
    <div id="stages"></div>
  </section>

  <section class="sec" id="papers">
    <div class="sec-h"><span class="k">04</span><h2 data-i="papers_h"></h2></div>
    <p class="sec-p" data-i="papers_p"></p>
    <div class="tl-ctl" id="areaCtl"></div>
    <div class="tl" id="timeline"></div>
  </section>

  <section class="sec" id="projects">
    <div class="sec-h"><span class="k">05</span><h2 data-i="proj_h"></h2></div>
    <p class="sec-p" data-i="proj_p"></p>
    <div class="ladder" id="ladder"></div>
  </section>

  <section class="sec" id="research">
    <div class="sec-h"><span class="k">06</span><h2 data-i="res_h"></h2></div>
    <p class="sec-p" data-i="res_p"></p>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="sec" id="check">
    <div class="sec-h"><span class="k">07</span><h2 data-i="check_h"></h2></div>
    <p class="sec-p" data-i="check_p"></p>
    <div class="check" id="checklist"></div>
  </section>

  <footer class="foot">
    <p data-i="foot1"></p>
    <p data-i="foot2"></p>
  </footer>
</div>

<script id="data" type="application/json">{"stages":[{"id":"s0","name":{"zh":"起点","en":"Foundations"},"weeks":{"zh":"第 1 到 2 周","en":"Weeks 1–2"},"note":{"zh":"理解 LLM 是什么、能做什么、不能做什么。已有 NLP 基础可以直接跳到下一阶段。","en":"Understand what an LLM is, what it can and cannot do. Skip ahead if you already have NLP basics."},"modules":["llm_foundations","zh_courses"]},{"id":"s1","name":{"zh":"Agent 入门","en":"Agent fundamentals"},"weeks":{"zh":"第 3 到 5 周","en":"Weeks 3–5"},"note":{"zh":"先不用框架，亲手写一个 agent 循环。这一阶段结束时应能解释 workflow 与 agent 的区别，并有一个能调用工具的小程序。","en":"Write an agent loop by hand before touching any framework. By the end you can explain workflows versus agents and have a small tool-using program."},"modules":["agent_from_scratch","agent_patterns","tool_calling"]},{"id":"s2","name":{"zh":"核心能力","en":"Core capabilities"},"weeks":{"zh":"第 6 到 8 周","en":"Weeks 6–8"},"note":{"zh":"协议、记忆、检索与编排框架。这是把玩具 agent 变成能处理真实任务的 agent 的三块积木。","en":"Protocols, memory, retrieval and orchestration frameworks: the three blocks that turn a toy agent into one that handles real tasks."},"modules":["mcp","memory_rag","frameworks"]},{"id":"s3","name":{"zh":"可靠性","en":"Reliability"},"weeks":{"zh":"第 9 到 11 周","en":"Weeks 9–11"},"note":{"zh":"失败模式、评估、可观测性与安全。大多数 agent 项目的差距不在能力，而在这里。","en":"Failure modes, evaluation, observability and security. Most agent projects fall short here, not on capability."},"modules":["failure_modes","evals","observability","agent_safety"]},{"id":"s4","name":{"zh":"生产化","en":"Production"},"weeks":{"zh":"第 12 到 14 周（求职路线）","en":"Weeks 12–14 (industry track)"},"note":{"zh":"把 agent 包成服务并部署。科研路线可以只读每个模块的「了解」层。","en":"Package the agent as a service and deploy it. Research-track readers can stop at the intro tier of each module."},"modules":["backend","deploy","prod_opt","realtime"]},{"id":"s5","name":{"zh":"前沿方向","en":"Frontiers"},"weeks":{"zh":"第 12 周起（科研路线）","en":"From week 12 (research track)"},"note":{"zh":"四个当前最活跃的方向，每个都附关键论文、基准、代码库和开放问题。求职路线选一个自己最感兴趣的深入即可。","en":"Four of the most active directions, each with key papers, benchmarks, codebases and open problems. Industry-track readers can pick one."},"modules":["agentic_rl","coding_agents","computer_use_agents","multi_agent_protocols","interpretability_auditing"]},{"id":"s6","name":{"zh":"做项目与持续成长","en":"Build and keep growing"},"weeks":{"zh":"贯穿全程","en":"Throughout"},"note":{"zh":"项目模板、科研入门方法、求职准备与社区。学习地图的终点是一个你自己的项目，而不是读完的清单。","en":"Project templates, how to start research, job preparation and community. The roadmap ends with a project of your own, not a finished reading list."},"modules":["project_ideas","research_howto","career_job","community_stay_current","open_problems_reading"]}],"modules":{"llm_foundations":{"title":{"zh":"LLM 基础","en":"LLM foundations"},"track":"both","why":{"zh":"Agent 的每个能力都建立在 LLM 的行为特性之上：上下文窗口、采样、指令遵循、幻觉。不需要会训练模型，但需要知道它为什么会犯错。","en":"Every agent capability rests on how LLMs behave: context windows, sampling, instruction following, hallucination. You do not need to train models, but you need to know why they fail."},"concepts":[{"zh":"token、上下文窗口、温度与采样","en":"Tokens, context window, temperature and sampling"},{"zh":"预训练、SFT、RLHF 三个阶段各自带来什么","en":"What pretraining, SFT and RLHF each contribute"},{"zh":"提示工程的基本技巧：示例、结构化、角色、思维链","en":"Prompting basics: examples, structure, roles, chain of thought"},{"zh":"幻觉与知识截止的成因","en":"Where hallucination and knowledge cutoffs come from"}],"questions":[{"zh":"为什么同一个提示两次输出不同？","en":"Why does the same prompt give different outputs?"},{"zh":"上下文窗口填满后会发生什么？","en":"What happens when the context window fills up?"},{"zh":"RLHF 解决了什么，没解决什么？","en":"What does RLHF solve, and what does it not?"}],"task":{"zh":"用任意一家 API 写 50 行代码：读入一段文本，让模型输出结构化 JSON 摘要，并统计 token 与费用。","en":"Write 50 lines against any API: read a text, have the model return a structured JSON summary, and log tokens and cost."}},"zh_courses":{"title":{"zh":"中文学习路径","en":"Chinese-language learning path"},"track":"both","why":{"zh":"中文社区已有成体系的开源教程（Datawhale 系列、李宏毅课程）和国产模型的官方 agent 文档。以中文为母语的读者可以从这里起步，再进入英文一手资料。","en":"The Chinese community has systematic open tutorials (Datawhale series, Hung-yi Lee's course) and official agent docs for Chinese models. Native readers can start here and move to English primary sources."},"concepts":[{"zh":"hello-agents 的章节结构对应本地图的前三个阶段","en":"hello-agents' chapters map onto the first three stages of this roadmap"},{"zh":"Qwen-Agent、MS-Agent 等国产框架与 LangGraph 的对应关系","en":"How Qwen-Agent and MS-Agent relate to LangGraph"},{"zh":"国产模型 API 与 OpenAI 兼容接口","en":"Chinese model APIs and OpenAI-compatible endpoints"}],"questions":[{"zh":"中文教程与英文官方文档说法不一致时以谁为准？","en":"When a Chinese tutorial and the English docs disagree, which wins?"}],"task":{"zh":"跟完 hello-agents 前四章，把它的示例改成调用国产模型 API。","en":"Finish the first four chapters of hello-agents and port its example to a Chinese model API."}},"agent_from_scratch":{"title":{"zh":"从零写一个 Agent","en":"An agent from scratch"},"track":"both","why":{"zh":"一个 agent 循环只有几十行：调用模型、解析工具调用、执行、把结果放回上下文、重复。先手写一遍，之后所有框架都只是这个循环的封装。","en":"An agent loop is a few dozen lines: call the model, parse tool calls, execute, append results, repeat. Write it once by hand; every framework afterwards is a wrapper around this loop."},"concepts":[{"zh":"思考、行动、观察的循环","en":"The think, act, observe loop"},{"zh":"停止条件与最大轮数","en":"Stop conditions and maximum turns"},{"zh":"工具结果如何回到上下文","en":"How tool results re-enter the context"},{"zh":"workflow 与 agent 的分界","en":"Where a workflow ends and an agent begins"}],"questions":[{"zh":"你的 agent 什么时候停？","en":"When does your agent stop?"},{"zh":"如果工具抛异常，循环怎么处理？","en":"What does the loop do when a tool throws?"},{"zh":"哪些任务用固定流程比 agent 更好？","en":"Which tasks are better served by a fixed pipeline?"}],"task":{"zh":"不用任何框架，写一个能读写文件、运行 shell 命令的 agent，让它修一个你故意埋的 bug。","en":"Without a framework, write an agent that reads and writes files and runs shell commands; have it fix a bug you planted."}},"agent_patterns":{"title":{"zh":"Agent 设计模式","en":"Agent design patterns"},"track":"both","why":{"zh":"路由、并行、编排者与执行者、评估者与优化者、反思。掌握这几个模式就能读懂大多数论文和产品的架构图，也能判断一个系统是否过度设计。","en":"Routing, parallelisation, orchestrator-worker, evaluator-optimiser, reflection. With these you can read most architecture diagrams in papers and products and spot over-engineering."},"concepts":[{"zh":"Anthropic 的 workflow 与 agent 分类","en":"Anthropic's workflow versus agent taxonomy"},{"zh":"ReAct、plan-and-execute、reflection 各自适合什么","en":"When ReAct, plan-and-execute and reflection each fit"},{"zh":"上下文工程：上下文是稀缺资源","en":"Context engineering: context as a scarce resource"},{"zh":"工具描述的写法影响 agent 表现","en":"Tool descriptions shape agent behaviour"}],"questions":[{"zh":"编排者与执行者模式的代价是什么？","en":"What does the orchestrator-worker pattern cost?"},{"zh":"反思什么时候有用，什么时候只是多花钱？","en":"When does reflection help, and when does it just cost more?"},{"zh":"如何压缩一个长对话的上下文？","en":"How would you compact a long conversation's context?"}],"task":{"zh":"把你的手写 agent 改成两种模式（路由 + 评估者优化者），在同一组 10 个任务上比较成本和成功率。","en":"Refactor your hand-written agent into two patterns (routing plus evaluator-optimiser) and compare cost and success on the same 10 tasks."}},"tool_calling":{"title":{"zh":"工具调用与结构化输出","en":"Tool calling and structured output"},"track":"both","why":{"zh":"工具调用是 agent 与世界交互的接口，结构化输出是让程序可靠消费模型结果的手段。两者都依赖 JSON Schema，也都会失败，失败后的处理决定系统的稳定性。","en":"Tool calling is the agent's interface to the world; structured output lets programs consume model results reliably. Both rely on JSON Schema, both fail, and the handling of failure decides stability."},"concepts":[{"zh":"JSON Schema：required、enum、additionalProperties","en":"JSON Schema: required, enum, additionalProperties"},{"zh":"tool_call 到 tool_result 的消息流","en":"The tool_call to tool_result message flow"},{"zh":"Pydantic 校验与失败重试","en":"Pydantic validation and retry on failure"},{"zh":"并行工具调用的安全性","en":"When parallel tool calls are safe"}],"questions":[{"zh":"模型返回了 schema 之外的字段怎么办？","en":"The model returns a field outside the schema: what now?"},{"zh":"工具描述里最重要的一句话是什么？","en":"What is the single most important sentence in a tool description?"}],"task":{"zh":"给 agent 加三个工具，用 Pydantic 定义输入输出，故意让模型产生非法参数并实现校验后重试。","en":"Add three tools with Pydantic-typed inputs and outputs; provoke invalid arguments and implement validate-then-retry."}},"mcp":{"title":{"zh":"MCP 与工具协议","en":"MCP and tool protocols"},"track":"both","why":{"zh":"MCP 把「模型如何接入工具与数据」标准化，已成为事实标准；A2A 则处理 agent 之间的互操作。理解协议层能让你的 agent 接入现有生态，而不是重复造轮子。","en":"MCP standardises how models connect to tools and data and has become the de facto standard; A2A handles agent-to-agent interoperability. Knowing the protocol layer lets your agent plug into an ecosystem instead of rebuilding it."},"concepts":[{"zh":"host、client、server 三方关系","en":"Host, client and server roles"},{"zh":"tools、resources、prompts 三类原语","en":"The three primitives: tools, resources, prompts"},{"zh":"stdio 与 streamable HTTP 传输","en":"stdio versus streamable HTTP transports"},{"zh":"安全边界：server 不可信、工具投毒","en":"Trust boundaries: untrusted servers, tool poisoning"}],"questions":[{"zh":"MCP 解决了普通 function calling 解决不了的什么问题？","en":"What does MCP solve that plain function calling cannot?"},{"zh":"延迟敏感的工具要不要放在 MCP 后面？","en":"Would you put a latency-critical tool behind MCP?"}],"task":{"zh":"用官方 Python SDK 写一个 MCP server，暴露一个工具和一个资源，用 Inspector 调通后从你的 agent 里调用。","en":"Write an MCP server with the official Python SDK exposing one tool and one resource; test it in the Inspector, then call it from your agent."}},"memory_rag":{"title":{"zh":"记忆与检索","en":"Memory and retrieval"},"track":"both","why":{"zh":"上下文窗口有限，agent 需要在窗口之外存东西：跨会话的长期记忆、按需检索的知识。记忆的设计决定了 agent 是否能从经验中改进。","en":"Context windows are finite, so agents need storage beyond them: long-term memory across sessions and knowledge retrieved on demand. Memory design decides whether an agent improves from experience."},"concepts":[{"zh":"短期（线程内）与长期（跨会话）记忆","en":"Short-term (thread) versus long-term (cross-session) memory"},{"zh":"语义、情景、程序性记忆","en":"Semantic, episodic and procedural memory"},{"zh":"chunking、混合检索、重排序、contextual retrieval","en":"Chunking, hybrid search, reranking, contextual retrieval"},{"zh":"记忆写入的时机与冲突处理","en":"When to write memory and how to resolve conflicts"}],"questions":[{"zh":"什么该进系统提示，什么该进检索？","en":"What belongs in the system prompt versus retrieval?"},{"zh":"记忆里的错误信息怎么被发现和纠正？","en":"How does wrong information in memory get caught and corrected?"}],"task":{"zh":"给 agent 加一个跨会话的用户档案存储和一个文档检索工具；检索内容只进 tool_result，不进系统提示。","en":"Add a cross-session user profile store and a document retrieval tool; retrieved content goes only into tool_result, never the system prompt."}},"frameworks":{"title":{"zh":"编排框架","en":"Orchestration frameworks"},"track":"both","why":{"zh":"LangGraph、OpenAI Agents SDK、Pydantic AI、Google ADK 各有取舍。框架带来持久化、人在回路、递归上限等能力，也带来抽象泄漏。手写过循环之后再学框架，才知道它替你做了什么。","en":"LangGraph, OpenAI Agents SDK, Pydantic AI and Google ADK make different trade-offs. Frameworks add persistence, human-in-the-loop and recursion limits, and also leak abstractions. Learn them after writing the loop yourself so you know what they do for you."},"concepts":[{"zh":"state、node、edge、checkpoint、interrupt","en":"State, node, edge, checkpoint, interrupt"},{"zh":"handoff 与 guardrail 原语","en":"Handoff and guardrail primitives"},{"zh":"声明式与命令式编排","en":"Declarative versus imperative orchestration"},{"zh":"选型标准：对上下文的控制力","en":"Selection criterion: how much control over context you keep"}],"questions":[{"zh":"你会把手写 agent 迁到框架上吗？得到什么，失去什么？","en":"Would you move your hand-written agent to a framework? What do you gain and lose?"},{"zh":"持久化状态对长任务意味着什么？","en":"What does persisted state mean for long-running tasks?"}],"task":{"zh":"用 LangGraph 或 OpenAI Agents SDK 重写你的 agent，加上人在回路的确认节点，写 10 行对比笔记。","en":"Rewrite your agent in LangGraph or the OpenAI Agents SDK with a human-in-the-loop approval node; write ten lines of comparison notes."}},"failure_modes":{"title":{"zh":"失败模式","en":"Failure modes"},"track":"both","why":{"zh":"Agent 失败有规律：规格不清、工具循环、上下文污染、agent 之间错位、验证缺失。掌握分类学，才能从一次失败推广到一类修复。","en":"Agent failures follow patterns: unclear specification, tool loops, context poisoning, inter-agent misalignment, missing verification. A taxonomy lets you generalise one failure into a class of fixes."},"concepts":[{"zh":"MAST 的 14 类失败与三大类别","en":"MAST's 14 failure modes in three categories"},{"zh":"max_turns 与 recursion_limit","en":"max_turns and recursion_limit"},{"zh":"上下文失效：poisoning、distraction、confusion、clash","en":"Context failure: poisoning, distraction, confusion, clash"},{"zh":"失败日志的最小字段集","en":"The minimum fields a failure log needs"}],"questions":[{"zh":"怎么发现一个正在死循环的 agent？","en":"How do you detect an agent that is looping?"},{"zh":"上一次失败是哪一类？防护加在哪一层？","en":"Which class was your last failure, and at which layer did you add the guard?"}],"task":{"zh":"对照 MAST 给你的 agent 写一张表：每类失败是「发生过 / 有防护 / 无防护」。","en":"Against MAST, tabulate for your agent whether each failure class has occurred, is guarded, or is unguarded."}},"evals":{"title":{"zh":"评估","en":"Evaluation"},"track":"both","why":{"zh":"没有评估就没有迭代。工业界靠 golden dataset、自动打分和 LLM judge 的校准；研究界靠基准和可复现的协议。两边的共同点是先做错误分析，再决定量什么。","en":"No evaluation, no iteration. Industry relies on golden datasets, automated scorers and calibrated LLM judges; research relies on benchmarks and reproducible protocols. Both start with error analysis before deciding what to measure."},"concepts":[{"zh":"三层评估：断言、LLM judge、人工标注","en":"Three tiers: assertions, LLM judge, human labels"},{"zh":"judge 的位置、冗长、自我偏好偏差","en":"Judge biases: position, verbosity, self-preference"},{"zh":"轨迹评估与结果评估，pass@k 与 pass^k","en":"Trajectory versus outcome evals, pass@k versus pass^k"},{"zh":"离线回归与在线 A/B 的衔接","en":"Connecting offline regression to online A/B"}],"questions":[{"zh":"怎么知道新提示比旧提示好？","en":"How do you know a new prompt beats the old one?"},{"zh":"怎么验证你的 LLM judge？","en":"How do you validate your LLM judge?"},{"zh":"一个 agent 基准的分数能说明什么，不能说明什么？","en":"What does a benchmark score tell you, and what does it not?"}],"task":{"zh":"建 30 条 golden 任务，写三个自动 scorer，跑一次基线并记录；之后每次改动都重跑。","en":"Build 30 golden tasks and three automated scorers; record a baseline and rerun after every change."}},"observability":{"title":{"zh":"可观测性","en":"Observability"},"track":"both","why":{"zh":"trace 是 agent 的显微镜。没有 trace，你只能靠猜；有了 trace，延迟、成本、路由决策和失败点都可以被定位。这也是求职时最容易展示工程成熟度的地方。","en":"Traces are the microscope for agents. Without them you guess; with them latency, cost, routing decisions and failure points become locatable. It is also the easiest place to show engineering maturity in interviews."},"concepts":[{"zh":"trace、span、attribute、event","en":"Trace, span, attribute, event"},{"zh":"Langfuse、LangSmith、Phoenix 与 OTel 的关系","en":"How Langfuse, LangSmith and Phoenix relate to OpenTelemetry"},{"zh":"OTel GenAI 语义约定","en":"OpenTelemetry GenAI semantic conventions"},{"zh":"四个黄金信号与 cost per conversation","en":"The four golden signals and cost per conversation"}],"questions":[{"zh":"一次对话在 trace 里长什么样？","en":"What does one conversation look like as a trace?"},{"zh":"怎么把成本归到会话？","en":"How do you attribute cost to a session?"}],"task":{"zh":"给 agent 接 Langfuse 或 Phoenix，每个模型和工具调用一个 span，找出最慢和最贵的一次调用。","en":"Instrument the agent with Langfuse or Phoenix, one span per model and tool call; find the slowest and the most expensive call."}},"agent_safety":{"title":{"zh":"安全与防护","en":"Security and guardrails"},"track":"both","why":{"zh":"能调工具的 agent 会读到不可信内容，prompt injection 因此从理论风险变成日常问题。安全不是过滤器，而是权限设计：私有数据、不可信内容、外发通道三者不能同时存在。","en":"A tool-using agent reads untrusted content, so prompt injection moves from theory to daily practice. Security is not a filter but a permission design: private data, untrusted content and an exfiltration channel must never coexist."},"concepts":[{"zh":"prompt injection 与 lethal trifecta","en":"Prompt injection and the lethal trifecta"},{"zh":"OWASP LLM Top 10 与 agentic 威胁","en":"OWASP LLM Top 10 and agentic threats"},{"zh":"最小权限、沙箱、人工确认","en":"Least privilege, sandboxes, human approval"},{"zh":"红队测试与 AgentDojo 类基准","en":"Red-teaming and AgentDojo-style benchmarks"}],"questions":[{"zh":"你的 agent 读到「忽略之前的指令」会发生什么？","en":"What happens when your agent reads 'ignore previous instructions'?"},{"zh":"哪个工具的权限最应该被收窄？","en":"Which tool's permissions most need narrowing?"}],"task":{"zh":"在你的 agent 检索的文档里埋一段注入指令，观察行为，然后用权限设计而不是提示词修复它。","en":"Plant an injected instruction in a document your agent retrieves, observe, then fix it with permission design rather than prompt wording."}},"backend":{"title":{"zh":"后端与 API","en":"Backend and APIs"},"track":"job","why":{"zh":"研究代码是脚本，产品代码是服务。把 agent 包成 HTTP 服务需要 FastAPI、async 并发模型和流式响应。","en":"Research code is scripts; product code is services. Wrapping an agent as an HTTP service needs FastAPI, the async concurrency model and streaming responses."},"concepts":[{"zh":"HTTP 方法、状态码、幂等性","en":"HTTP methods, status codes, idempotency"},{"zh":"FastAPI 路由、依赖注入、Pydantic 校验","en":"FastAPI routing, dependency injection, Pydantic validation"},{"zh":"asyncio：什么会阻塞事件循环","en":"asyncio: what blocks the event loop"},{"zh":"SSE 与 WebSocket 流式输出","en":"Streaming with SSE and WebSockets"}],"questions":[{"zh":"LLM 服务为什么用 async？","en":"Why async for an LLM service?"},{"zh":"设计开启会话、发送回合、流式返回的三个接口。","en":"Design the three endpoints: open session, send turn, stream reply."}],"task":{"zh":"把 agent 包成 FastAPI 服务，回合接口用 SSE 流式返回，写 pytest 把模型调用 mock 掉。","en":"Wrap the agent in FastAPI with an SSE-streaming turn endpoint; write pytest with the model call mocked."}},"deploy":{"title":{"zh":"容器与部署","en":"Containers and deployment"},"track":"job","why":{"zh":"能在别人的机器上跑起来才叫产品。Docker、云上的无服务器容器、CI/CD 和密钥管理是最小集合。","en":"It is a product only when it runs on someone else's machine. Docker, serverless containers, CI/CD and secret management are the minimum set."},"concepts":[{"zh":"Dockerfile、多阶段构建、层缓存","en":"Dockerfile, multi-stage builds, layer caching"},{"zh":"Cloud Run 类平台的冷启动与并发","en":"Cold starts and concurrency on Cloud Run-style platforms"},{"zh":"密钥不进代码","en":"Secrets never in code"},{"zh":"GitHub Actions 自动测试与部署","en":"GitHub Actions for tests and deploys"}],"questions":[{"zh":"第一个请求为什么慢三秒？","en":"Why is the first request three seconds slow?"},{"zh":"API key 放在哪里？","en":"Where do the API keys live?"}],"task":{"zh":"容器化 agent 服务并部署到任意云，push 到 main 自动跑测试并部署。","en":"Containerise the agent service, deploy to any cloud, and auto-test-and-deploy on push to main."}},"prod_opt":{"title":{"zh":"延迟、成本与可靠性","en":"Latency, cost and reliability"},"track":"job","why":{"zh":"生产 agent 的三个硬指标：首 token 延迟、每次对话成本、供应商故障时的表现。缓存、路由、退避与 fallback 是标准手段。","en":"Three hard numbers for production agents: time to first token, cost per conversation, behaviour when a provider fails. Caching, routing, backoff and fallbacks are the standard tools."},"concepts":[{"zh":"TTFT、流式、prompt caching","en":"TTFT, streaming, prompt caching"},{"zh":"小模型路由到大模型","en":"Routing easy requests to smaller models"},{"zh":"指数退避、熔断、供应商 fallback","en":"Exponential backoff, circuit breakers, provider fallbacks"},{"zh":"按会话归集成本","en":"Attributing cost per conversation"}],"questions":[{"zh":"供应商高峰期返回 429，你的服务做什么？","en":"The provider returns 429 at peak: what does your service do?"},{"zh":"成本减半而质量不降，从哪里下手？","en":"Halve cost without losing quality: where do you start?"}],"task":{"zh":"加 prompt caching、小模型路由和 fallback，对比改造前后的 TTFT 与每次对话成本。","en":"Add prompt caching, small-model routing and a fallback; compare TTFT and cost per conversation before and after."}},"realtime":{"title":{"zh":"实时与语音","en":"Realtime and voice"},"track":"job","why":{"zh":"语音和视频 agent 把延迟预算压到一秒以内，需要流式 STT、LLM、TTS 的级联或端到端语音模型。了解即可，除非目标岗位是实时系统。","en":"Voice and video agents squeeze the latency budget under a second, using cascaded streaming STT, LLM and TTS or end-to-end speech models. Awareness is enough unless the target role is realtime systems."},"concepts":[{"zh":"级联管道与 speech-to-speech 的取舍","en":"Cascaded pipelines versus speech-to-speech"},{"zh":"语音回合的延迟预算拆分","en":"Breaking down a voice turn's latency budget"},{"zh":"WebRTC 与 WebSocket 的角色","en":"Roles of WebRTC and WebSockets"}],"questions":[{"zh":"一个语音回合的延迟花在哪里？","en":"Where does the latency go in one voice turn?"}],"task":{"zh":"用 Pipecat 或 LiveKit 跑一个本地语音 demo，测一次端到端延迟并拆分到各阶段。","en":"Run a local voice demo with Pipecat or LiveKit; measure end-to-end latency and split it by stage."}},"agentic_rl":{"title":{"zh":"Agentic RL 与后训练","en":"Agentic RL and post-training"},"track":"research","why":{"zh":"DeepSeek-R1 之后，用可验证奖励的强化学习训练模型「学会使用工具和多轮行动」成为最热的研究线。它把 agent 从提示工程推向训练问题，也是研究入门的最佳切口之一。","en":"Since DeepSeek-R1, training models to use tools and act over multiple turns with verifiable-reward RL has become the hottest research line. It moves agents from prompt engineering to a training problem and is one of the best entry points for research."},"concepts":[{"zh":"PPO、GRPO、DAPO、GSPO 的关系","en":"How PPO, GRPO, DAPO and GSPO relate"},{"zh":"可验证奖励与奖励设计","en":"Verifiable rewards and reward design"},{"zh":"多轮工具调用的 rollout 与 token masking","en":"Multi-turn tool rollouts and token masking"},{"zh":"训练框架：verl、OpenRLHF、SkyRL、rLLM、Agent Lightning","en":"Training frameworks: verl, OpenRLHF, SkyRL, rLLM, Agent Lightning"}],"questions":[{"zh":"为什么 SFT 教不会模型「什么时候」调用工具？","en":"Why can't SFT alone teach a model when to call a tool?"},{"zh":"奖励被 hack 时你会看到什么现象？","en":"What do you see when the reward gets hacked?"}],"open":[{"zh":"长时程任务的信用分配","en":"Credit assignment over long horizons"},{"zh":"环境与奖励的可扩展构建","en":"Scalable construction of environments and rewards"},{"zh":"训练后的泛化：新工具、新环境","en":"Generalisation after training to new tools and environments"}],"task":{"zh":"在单卡上用 TRL 或 Unsloth 跑一次 GRPO，奖励函数是「工具调用格式正确且结果正确」，画出奖励曲线。","en":"Run GRPO on one GPU with TRL or Unsloth, rewarding correct tool-call format plus correct result; plot the reward curve."}},"coding_agents":{"title":{"zh":"Coding agents","en":"Coding agents"},"track":"both","why":{"zh":"编程是 agent 落地最成熟的领域：SWE-bench 定义了标准，Claude Code、Codex、OpenHands 等把它变成产品。读懂 100 行的 mini-swe-agent，就理解了这个领域的核心。","en":"Coding is the most mature agent domain: SWE-bench set the standard and Claude Code, Codex and OpenHands turned it into products. Reading the 100-line mini-swe-agent gets you to the core of the field."},"concepts":[{"zh":"agent-computer interface 的设计","en":"Agent-computer interface design"},{"zh":"SWE-bench Verified、Pro 与 Terminal-Bench","en":"SWE-bench Verified, Pro and Terminal-Bench"},{"zh":"上下文管理：CLAUDE.md、子 agent、压缩","en":"Context management: CLAUDE.md, subagents, compaction"},{"zh":"训练数据合成：SWE-Gym、SWE-smith","en":"Training data synthesis: SWE-Gym, SWE-smith"}],"questions":[{"zh":"为什么接口设计比模型大小对成绩影响更大？","en":"Why does interface design move the score more than model size?"},{"zh":"长任务里 agent 最常在哪一步失败？","en":"Where do agents most often fail in long tasks?"}],"open":[{"zh":"跨仓库、长时程的软件工程任务","en":"Cross-repository, long-horizon engineering tasks"},{"zh":"基准污染与真实生产力的差距","en":"Benchmark contamination versus real productivity"},{"zh":"验证器与测试生成","en":"Verifiers and test generation"}],"task":{"zh":"读完 mini-swe-agent 源码，在 SWE-bench Lite 的 20 个实例上跑通并分析失败原因。","en":"Read mini-swe-agent end to end, run it on 20 SWE-bench Lite instances and analyse the failures."}},"computer_use_agents":{"title":{"zh":"Computer-use 与浏览器 agent","en":"Computer-use and browser agents"},"track":"both","why":{"zh":"让 agent 直接操作屏幕、浏览器和手机，是通向通用助理的路径。OSWorld、WebArena 等基准显示成功率仍然很低，因此既是产品热点也是研究缺口。","en":"Letting agents operate screens, browsers and phones is the path to general assistants. Benchmarks such as OSWorld and WebArena show success rates are still low, so it is both a product hotspot and a research gap."},"concepts":[{"zh":"截图驱动与无障碍树驱动两条路线","en":"Screenshot-driven versus accessibility-tree approaches"},{"zh":"grounding：从指令到坐标","en":"Grounding: from instruction to coordinates"},{"zh":"原生 GUI 模型（UI-TARS）与模块化框架（Agent S）","en":"Native GUI models (UI-TARS) versus modular frameworks (Agent S)"},{"zh":"安全：不可逆动作与确认","en":"Safety: irreversible actions and confirmation"}],"questions":[{"zh":"为什么网页 agent 在真实网站上远比在沙箱里差？","en":"Why do web agents do far worse on real sites than in sandboxes?"},{"zh":"什么动作必须要人确认？","en":"Which actions must require human confirmation?"}],"open":[{"zh":"长时程、上百步的任务","en":"Long-horizon tasks with hundreds of steps"},{"zh":"跨应用的状态追踪","en":"State tracking across applications"},{"zh":"对抗性网页内容","en":"Adversarial web content"}],"task":{"zh":"用 browser-use 或 Playwright MCP 写一个能完成三步网页任务的 agent，记录每一步的截图和决策。","en":"With browser-use or Playwright MCP, build an agent that completes a three-step web task; log screenshot and decision per step."}},"multi_agent_protocols":{"title":{"zh":"多智能体与协议","en":"Multi-agent systems and protocols"},"track":"both","why":{"zh":"多 agent 系统在研究里热、在生产里争议大：Anthropic 的研究系统证明它有用，Cognition 的文章提醒它容易失败。MAST 给出了失败分类，MCP 与 A2A 给出了互操作协议。","en":"Multi-agent systems are hot in research and contested in production: Anthropic's research system shows they work, Cognition's essay shows how they fail. MAST classifies the failures; MCP and A2A provide interoperability."},"concepts":[{"zh":"编排者与子 agent 的上下文分配","en":"Context allocation between orchestrator and subagents"},{"zh":"何时不该用多 agent","en":"When not to use multiple agents"},{"zh":"MCP（agent 到工具）与 A2A（agent 到 agent）","en":"MCP (agent to tool) versus A2A (agent to agent)"},{"zh":"MAST 的三大失败类别","en":"MAST's three failure categories"}],"questions":[{"zh":"两个 agent 共享多少上下文才够？","en":"How much context must two agents share?"},{"zh":"什么任务真的需要并行 agent？","en":"Which tasks truly need parallel agents?"}],"open":[{"zh":"多 agent 的信用分配与联合训练","en":"Credit assignment and joint training for multi-agent systems"},{"zh":"通信拓扑的选择","en":"Choosing communication topologies"},{"zh":"跨组织 agent 的信任与身份","en":"Trust and identity for agents across organisations"}],"task":{"zh":"把你的 agent 拆成编排者加两个子 agent，在同一任务集上和单 agent 对比成本与成功率，并用 MAST 标注失败。","en":"Split your agent into an orchestrator plus two subagents; compare cost and success with the single agent on the same tasks and label failures with MAST."}},"interpretability_auditing":{"title":{"zh":"安全、对齐与可解释","en":"Safety, alignment and interpretability"},"track":"research","why":{"zh":"Agent 会自主行动，因此「它为什么这么做」从学术问题变成审计需求。推理链不一定忠实，监控它是一个脆弱但宝贵的机会；trace 与审计记录是工程侧的对应物。","en":"Agents act autonomously, so 'why did it do that' turns from an academic question into an audit requirement. Reasoning traces are not always faithful; monitoring them is a fragile but valuable opportunity, and traces plus audit logs are the engineering counterpart."},"concepts":[{"zh":"思维链忠实性与可监控性","en":"Chain-of-thought faithfulness and monitorability"},{"zh":"agentic misalignment 与 sabotage 评估","en":"Agentic misalignment and sabotage evaluations"},{"zh":"机制可解释性入门：TransformerLens、attribution graphs","en":"Mechanistic interpretability basics: TransformerLens, attribution graphs"},{"zh":"审计记录：OTel GenAI 约定、AgentOps","en":"Audit trails: OTel GenAI conventions, AgentOps"}],"questions":[{"zh":"模型说的理由和真实原因不一致时，审计还能依赖什么？","en":"When the stated reason differs from the real cause, what can an audit still rely on?"},{"zh":"哪些 agent 行为必须留下不可篡改的记录？","en":"Which agent actions must leave tamper-proof records?"}],"open":[{"zh":"面向 agent 的可解释性方法","en":"Interpretability methods designed for agents"},{"zh":"监控推理链的长期有效性","en":"Long-term viability of reasoning-trace monitoring"},{"zh":"法规对可解释性的具体要求（EU AI Act）","en":"Concrete regulatory requirements for explainability (EU AI Act)"}],"task":{"zh":"给你的 agent 设计一份审计记录格式，能回答「谁在何时因为什么证据做了什么」，并用一次真实运行填满它。","en":"Design an audit-record format for your agent that answers who did what, when, on what evidence; fill it from one real run."}},"project_ideas":{"title":{"zh":"项目模板与起点","en":"Project templates and starting points"},"track":"both","why":{"zh":"最好的学习是改一个能跑的东西。这里是官方快速启动、开源 deep research、语音 agent 和课程结课项目，每个都能在一天内跑起来。","en":"The best learning is modifying something that runs. Here are official quickstarts, open deep-research agents, voice agents and course capstones, each runnable within a day."},"concepts":[{"zh":"先跑通再改动","en":"Run it first, then change it"},{"zh":"每个项目至少加一个评估","en":"Every project gets at least one evaluation"},{"zh":"写一篇复盘博客","en":"Write a retrospective post"}],"questions":[{"zh":"你改动了什么，指标变了多少？","en":"What did you change, and how much did the metric move?"}],"task":{"zh":"从下方项目阶梯选一个，两周内交付并公开。","en":"Pick one rung from the project ladder below; deliver and publish it within two weeks."}},"research_howto":{"title":{"zh":"科研入门方法","en":"How to start research"},"track":"research","why":{"zh":"Agent 研究进展快、噪音大。读论文的方法、选题的判断、复现的习惯和写作的训练，比任何一篇具体论文都更持久。","en":"Agent research moves fast and is noisy. Methods for reading, judgement in choosing problems, the habit of reproduction and training in writing outlast any single paper."},"concepts":[{"zh":"三遍读论文法","en":"The three-pass paper reading method"},{"zh":"目标驱动与问题驱动的研究","en":"Goal-driven versus problem-driven research"},{"zh":"复现一篇论文作为入门仪式","en":"Reproducing a paper as the rite of passage"},{"zh":"会议与投稿节奏：NeurIPS、ICLR、ICML、ACL、COLM","en":"Venues and cycles: NeurIPS, ICLR, ICML, ACL, COLM"}],"questions":[{"zh":"这篇论文的主张靠哪一个实验支撑？","en":"Which single experiment carries this paper's claim?"},{"zh":"如果结果不可复现，你的下一步是什么？","en":"If the result does not reproduce, what is your next step?"}],"task":{"zh":"复现 ReAct 在 HotpotQA 上的结果，写一页复现报告，包括与原文的差异。","en":"Reproduce ReAct on HotpotQA and write a one-page report including deviations from the original."}},"career_job":{"title":{"zh":"求职准备","en":"Job preparation"},"track":"job","why":{"zh":"Agent 工程师岗位看三样：一个能打开的项目、讲清楚故障与修复的能力、以及 LLM 应用的系统设计。刷题是次要的。","en":"Agent engineering roles look for three things: a project one can open, the ability to explain a failure and its fix, and system design for LLM applications. Algorithm drills are secondary."},"concepts":[{"zh":"AI Engineer 岗位画像","en":"The AI Engineer role profile"},{"zh":"STAR 故事库：至少三个来自自己的项目","en":"A STAR story bank with at least three from your own projects"},{"zh":"LLM 应用系统设计的答题框架","en":"A framework for LLM system design questions"},{"zh":"公开写作作为作品集","en":"Public writing as portfolio"}],"questions":[{"zh":"你的项目在生产里出过什么故障，怎么发现的？","en":"What broke in your project, and how did you find it?"},{"zh":"设计一个带评估与追踪的 agent 服务。","en":"Design an agent service with evaluation and tracing."}],"task":{"zh":"为你的项目写一篇「故障、诊断、度量」的博客，并准备一个 10 分钟的系统设计白板答案。","en":"Write a failure-diagnosis-measurement post about your project and prepare a 10-minute system-design whiteboard answer."}},"community_stay_current":{"title":{"zh":"社区与持续跟进","en":"Community and staying current"},"track":"both","why":{"zh":"这个领域每月都有新东西。固定两三个高信噪比的信息源，比订阅二十个更有效。","en":"Something new lands every month. Two or three high-signal sources beat twenty subscriptions."},"concepts":[{"zh":"一手来源优先：实验室博客、论文、代码","en":"Primary sources first: lab blogs, papers, code"},{"zh":"每周固定一小时的跟进节奏","en":"A fixed weekly hour for catching up"}],"questions":[{"zh":"上个月最重要的一篇文章是什么，为什么？","en":"What was the most important piece last month, and why?"}],"task":{"zh":"选三个信息源，连续四周每周写三句话的跟进笔记。","en":"Pick three sources and write three-sentence notes weekly for four weeks."}},"open_problems_reading":{"title":{"zh":"全局视角与开放问题","en":"The big picture and open problems"},"track":"both","why":{"zh":"读几篇高质量的总览，再看课程与 METR 这类评测机构的报告，能帮你判断哪些方向是趋势、哪些是噪音。","en":"A few high-quality overviews, plus university courses and reports from evaluators such as METR, help you separate trends from noise."},"concepts":[{"zh":"Software 3.0 与部分自治","en":"Software 3.0 and partial autonomy"},{"zh":"任务时程作为能力指标","en":"Task horizon as a capability metric"},{"zh":"长时程部署的真实失败（Project Vend）","en":"Real failures of long-horizon deployment (Project Vend)"}],"questions":[{"zh":"你认为未来两年 agent 领域最可能被解决的问题是什么？","en":"Which agent problem do you expect to be solved within two years?"}],"task":{"zh":"写一页你自己的「agent 领域地图」，和本页的地图比较差异。","en":"Write your own one-page map of the agent field and compare it with the one on this page."}}},"landscape":{"intro":{"zh":"把 agent 领域看成五层：底层是模型能力，中间是单个 agent 的核心机制，再往上是多 agent 与协议，顶层是应用领域，旁边贯穿的是保障层。点击节点跳到对应模块。","en":"Think of the field as five layers: model capability at the bottom, the core mechanisms of a single agent above it, then multi-agent systems and protocols, application domains on top, with an assurance layer running alongside. Click a node to jump to its module."},"layers":[{"name":{"zh":"应用领域","en":"Application domains"},"nodes":[{"label":{"zh":"Coding agents","en":"Coding agents"},"mod":"coding_agents"},{"label":{"zh":"Computer-use / 浏览器","en":"Computer-use / browser"},"mod":"computer_use_agents"},{"label":{"zh":"Deep research","en":"Deep research"},"mod":"project_ideas"},{"label":{"zh":"对话与语音助理","en":"Conversational and voice assistants"},"mod":"realtime"},{"label":{"zh":"科学与数据分析","en":"Science and data analysis"},"mod":"open_problems_reading"}]},{"name":{"zh":"系统层","en":"Systems layer"},"nodes":[{"label":{"zh":"多 agent 编排","en":"Multi-agent orchestration"},"mod":"multi_agent_protocols"},{"label":{"zh":"协议：MCP、A2A","en":"Protocols: MCP, A2A"},"mod":"mcp"},{"label":{"zh":"编排框架","en":"Orchestration frameworks"},"mod":"frameworks"},{"label":{"zh":"服务化与部署","en":"Services and deployment"},"mod":"deploy"}]},{"name":{"zh":"单 agent 核心机制","en":"Single-agent core"},"nodes":[{"label":{"zh":"规划与推理","en":"Planning and reasoning"},"mod":"agent_patterns"},{"label":{"zh":"工具调用","en":"Tool use"},"mod":"tool_calling"},{"label":{"zh":"记忆与检索","en":"Memory and retrieval"},"mod":"memory_rag"},{"label":{"zh":"上下文工程","en":"Context engineering"},"mod":"agent_patterns"},{"label":{"zh":"反思与自我改进","en":"Reflection and self-improvement"},"mod":"agentic_rl"}]},{"name":{"zh":"模型层","en":"Model layer"},"nodes":[{"label":{"zh":"预训练与指令微调","en":"Pretraining and instruction tuning"},"mod":"llm_foundations"},{"label":{"zh":"推理模型与 RLVR","en":"Reasoning models and RLVR"},"mod":"agentic_rl"},{"label":{"zh":"Agentic 后训练","en":"Agentic post-training"},"mod":"agentic_rl"},{"label":{"zh":"原生 GUI 与工具模型","en":"Native GUI and tool models"},"mod":"computer_use_agents"}]},{"name":{"zh":"保障层（贯穿）","en":"Assurance (cross-cutting)"},"side":true,"nodes":[{"label":{"zh":"评估与基准","en":"Evaluation and benchmarks"},"mod":"evals"},{"label":{"zh":"可观测性","en":"Observability"},"mod":"observability"},{"label":{"zh":"失败模式","en":"Failure modes"},"mod":"failure_modes"},{"label":{"zh":"安全与注入防护","en":"Security and injection defence"},"mod":"agent_safety"},{"label":{"zh":"对齐与可解释","en":"Alignment and interpretability"},"mod":"interpretability_auditing"}]}]},"projects":[{"level":{"zh":"第 1 级 · 一个周末","en":"Rung 1 · One weekend"},"name":{"zh":"手写工具 agent","en":"Hand-written tool agent"},"desc":{"zh":"不用框架，写一个能读写文件和执行 shell 的 agent，让它修一个你埋的 bug。","en":"No framework: an agent that reads and writes files and runs shell commands; it fixes a bug you planted."},"learn":{"zh":"agent 循环、工具调用、停止条件","en":"The agent loop, tool calling, stop conditions"},"mods":["agent_from_scratch","tool_calling"]},{"level":{"zh":"第 2 级 · 一周","en":"Rung 2 · One week"},"name":{"zh":"带记忆与检索的个人助理","en":"Personal assistant with memory and retrieval"},"desc":{"zh":"接入你自己的笔记或文档，跨会话记住偏好，接一个 MCP server。","en":"Connect your own notes or documents, remember preferences across sessions, plug in one MCP server."},"learn":{"zh":"记忆划分、检索、MCP","en":"Memory tiers, retrieval, MCP"},"mods":["memory_rag","mcp"]},{"level":{"zh":"第 3 级 · 两周","en":"Rung 3 · Two weeks"},"name":{"zh":"带评估与追踪的 deep research agent","en":"Deep research agent with evals and tracing"},"desc":{"zh":"多步搜索与综述，30 条 golden 问题，三个自动 scorer，每次调用都有 trace。","en":"Multi-step search and synthesis, 30 golden questions, three automated scorers, a trace for every call."},"learn":{"zh":"评估闭环、可观测性、失败分析","en":"The eval loop, observability, failure analysis"},"mods":["evals","observability","failure_modes"]},{"level":{"zh":"第 4 级 · 三周（求职）","en":"Rung 4 · Three weeks (industry)"},"name":{"zh":"上线的 agent 服务","en":"A deployed agent service"},"desc":{"zh":"FastAPI 流式接口、容器化、云部署、CI/CD、prompt caching 与 fallback、cost per conversation 看板。","en":"FastAPI streaming API, containerised, cloud deployed, CI/CD, prompt caching and fallbacks, a cost-per-conversation dashboard."},"learn":{"zh":"生产化全链路","en":"The full production path"},"mods":["backend","deploy","prod_opt"]},{"level":{"zh":"第 4 级 · 三周（科研）","en":"Rung 4 · Three weeks (research)"},"name":{"zh":"复现并改进一个基准结果","en":"Reproduce and improve a benchmark result"},"desc":{"zh":"在 SWE-bench Lite、WebArena 子集或 tau-bench 上复现一个开源 agent，做一处改动并做消融。","en":"Reproduce an open agent on SWE-bench Lite, a WebArena subset or tau-bench; make one change and run an ablation."},"learn":{"zh":"基准协议、可复现性、消融","en":"Benchmark protocols, reproducibility, ablations"},"mods":["coding_agents","computer_use_agents","research_howto"]},{"level":{"zh":"第 5 级 · 一到两个月","en":"Rung 5 · One to two months"},"name":{"zh":"用 RL 训练一个小 agent","en":"Train a small agent with RL"},"desc":{"zh":"单卡 GRPO 训练一个 1.5B 到 7B 模型学会多轮工具调用，报告奖励曲线、泛化测试与失败案例。","en":"Single-GPU GRPO training of a 1.5B to 7B model for multi-turn tool use; report reward curves, generalisation tests and failure cases."},"learn":{"zh":"agentic RL 全流程","en":"The agentic RL pipeline end to end"},"mods":["agentic_rl","evals"]},{"level":{"zh":"第 5 级 · 一到两个月","en":"Rung 5 · One to two months"},"name":{"zh":"多 agent 系统与失败分析","en":"Multi-agent system with failure analysis"},"desc":{"zh":"编排者加子 agent 完成一个复杂任务，用 MAST 标注 100 条 trace，提出并验证一项修复。","en":"An orchestrator plus subagents on a complex task; label 100 traces with MAST, propose and validate one fix."},"learn":{"zh":"多 agent 设计、失败分类、实证研究","en":"Multi-agent design, failure taxonomy, empirical study"},"mods":["multi_agent_protocols","failure_modes"]}],"research_path":[{"zh":"读三篇综述建立坐标系：Wang et al. 2023、CoALA、Agentic RL survey。","en":"Read three surveys to build coordinates: Wang et al. 2023, CoALA, the agentic RL survey."},{"zh":"复现一篇经典（ReAct 或 Reflexion），写复现报告。","en":"Reproduce one classic (ReAct or Reflexion) and write a reproduction report."},{" te":"2026-06","title":"OSWorld 2.0: Benchmarking Computer Use Agents on Long-Horizon Real-World Tasks","authors":"Tao Yu et al. (HKU)","url":"https://arxiv.org/abs/2606.29537","arxiv":"2606.29537","area":"computer-use","why":{"en":"108 long-horizon workflows needing hundreds of actions; best agents complete only about 20%.","zh":"108个需数百步操作的长程工作流，最佳agent完成率仅约20%"}},{"date":"2026-07","title":"Qwen-UI-Agent Technical Report","authors":"Hanzhang Zhou et al. (Alibaba Qwen)","url":"https://arxiv.org/abs/2607.28227","arxiv":"2607.28227","area":"computer-use","why":{"en":"Open multiplatform GUI+CLI agent model reaching SOTA on mobile and competitive on desktop/web.","zh":"开源跨平台GUI+CLI agent模型，移动端SOTA，桌面/网页具竞争力"}},{"date":"2026-07","title":"MCP 2026-07-28 Specification","authors":"MCP maintainers","url":"https://blog.modelcontextprotocol.io/posts/2026-07-28/","arxiv":null,"area":"protocol","why":{"en":"Makes MCP stateless request/response, adds multi-round-trip requests, stronger authorization and an extensions framework.","zh":"让MCP变为无状态请求响应，新增多轮请求、更强授权与扩展框架"}}]}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const UI = {
    eyebrow:{zh:'LLM Agent 学习地图 · 从入门到前沿',en:'A roadmap for LLM agents · from first loop to frontier'},
    title:{zh:'Agent <span>Atlas</span>',en:'Agent <span>Atlas</span>'},
    lede:{zh:'一张面向工程师与研究者的 agent 学习地图：领域全景、七个阶段的学习路线、经核验的资源、关键论文时间线和一条通向你自己项目的阶梯。',en:'A learning map for engineers and researchers: the landscape of the field, a seven-stage path, verified resources, a timeline of key papers and a ladder that ends in a project of your own.'},
    st_mods:{zh:'个模块',en:'modules'}, st_res:{zh:'条核验资源',en:'verified resources'}, st_papers:{zh:'篇关键论文',en:'key papers'}, st_must:{zh:'必读核心路径',en:'core reading path'},
    prog_h:{zh:'我的进度（保存在本机浏览器）',en:'My progress (stored in this browser)'}, track_h:{zh:'选择路线',en:'Choose a track'},
    tr_both:{zh:'全部',en:'Everything'}, tr_both_d:{zh:'不做筛选',en:'no filtering'},
    tr_job:{zh:'求职 / 工程',en:'Industry / engineering'}, tr_job_d:{zh:'阶段 1 到 4，加一个上线项目',en:'stages 1–4 plus a deployed project'},
    tr_research:{zh:'科研',en:'Research'}, tr_research_d:{zh:'阶段 1 到 3，加前沿方向与复现',en:'stages 1–3 plus frontiers and reproduction'},
    nav_how:{zh:'用法',en:'How to use'}, nav_map:{zh:'领域地图',en:'Landscape'}, nav_path:{zh:'学习路线',en:'Path'}, nav_papers:{zh:'论文时间线',en:'Papers'}, nav_projects:{zh:'项目阶梯',en:'Projects'}, nav_research:{zh:'科研入门',en:'Research'}, nav_check:{zh:'自检',en:'Checklist'},
    how_h:{zh:'怎么用这张地图',en:'How to use this map'},
    how_p1:{zh:'这不是一份要从头读到尾的清单。先看领域地图找到自己的位置，再按阶段推进；每个模块分了解、掌握、深入三层，标了「必读」的资源构成约 150 小时的核心路径。',en:'This is not a list to read end to end. Find your position on the landscape first, then move through the stages; each module has intro, core and deep tiers, and the resources marked "must" form a core path of roughly 150 hours.'},
    how_p2:{zh:'每个模块都以一个动手任务结尾。读完不动手，等于没学。',en:'Every module ends with a hands-on task. Reading without building does not count.'},
    how_p3:{zh:'求职路线：以第 1 到 4 阶段和项目阶梯第 4 级（求职）为主，前沿方向选一个；重点是可打开的项目、评估与追踪、系统设计表达。 科研路线：第 1 到 3 阶段打底，第 4 阶段只看「了解」层，重心放在前沿方向、论文时间线、复现与项目阶梯第 5 级。',en:'Industry track: focus on stages 1 to 4 and project rung 4 (industry); pick one frontier. What matters is an openable project, evals and tracing, and system-design articulation. Research track: stages 1 to 3 as foundation, only the intro tier of stage 4, then the frontiers, the paper timeline, reproduction and project rung 5.'},
    how_p4:{zh:'所有链接在 2026 年 9 月逐条访问核验。资源会过时，欢迎通过 GitHub 提交更正与补充。',en:'Every link was fetched and verified in September 2026. Resources go stale; corrections and additions via GitHub are welcome.'},
    map_h:{zh:'领域地图',en:'The landscape'},
    path_h:{zh:'学习路线',en:'The learning path'},
    path_p:{zh:'七个阶段，每个模块含「为什么重要」「要能说清楚的概念」「自检问题」、三层资源与动手任务。前沿模块另附开放问题。',en:'Seven stages. Each module has why it matters, the concepts to be able to explain, self-check questions, three tiers of resources and a hands-on task. Frontier modules add open problems.'},
    filter:{zh:'筛选',en:'Filter'}, f_must:{zh:'只看必读',en:'Must-read only'}, f_zh:{zh:'中文资源',en:'Chinese-language'}, f_hide:{zh:'隐藏已完成',en:'Hide done'},
    lv_intro:{zh:'了解',en:'Intro'}, lv_core:{zh:'掌握',en:'Core'}, lv_deep:{zh:'深入',en:'Deep'},
    t_official:{zh:'官方文档',en:'Docs'}, t_course:{zh:'课程',en:'Courses'}, t_video:{zh:'视频',en:'Videos'}, t_blog:{zh:'博客',en:'Blogs'}, t_paper:{zh:'论文',en:'Papers'}, t_code:{zh:'代码',en:'Code'}, t_book:{zh:'书',en:'Books'},
    papers_h:{zh:'关键论文时间线',en:'Key papers timeline'},
    papers_p:{zh:'从 GPT-3 到 2026 年的 agentic RL 与 computer-use 模型，按首次发布时间排列。每篇一句话说明它改变了什么。选研究方向时先沿一条线读完，再横向比较。',en:'From GPT-3 to the agentic RL and computer-use models of 2026, ordered by first release. One sentence per paper on what it changed. When choosing a research direction, read along one line first, then compare across lines.'},
    proj_h:{zh:'项目阶梯',en:'Project ladder'},
    proj_p:{zh:'从一个周末到两个月，每一级都是可以公开的完整项目。第 4 级起按路线分岔。',en:'From one weekend to two months, each rung is a complete, publishable project. From rung 4 the ladder forks by track.'},
    res_h:{zh:'科研入门六步',en:'Six steps into research'},
    res_p:{zh:'想以 agent 为研究方向的人，可以按这个顺序走，大约需要一个学期。',en:'For those who want agents as a research direction, this order takes roughly one semester.'},
    check_h:{zh:'自检清单',en:'Self-check'},
    check_p:{zh:'全部打勾时，你已经具备申请 agent 工程岗位或进入 agent 研究的基础。',en:'When every box is ticked you have the foundation to apply for agent engineering roles or to begin agent research.'},
    foot1:{zh:'Agent Atlas 由 Anqi Zhao 整理，内容以 CC BY 4.0 协议发布，代码以 MIT 协议发布。资源核验日期 2026-09-15。',en:'Agent Atlas is curated by Anqi Zhao. Content is CC BY 4.0, code is MIT. Resources verified 2026-09-15.'},
    foot2:{zh:'纠错与补充：在 GitHub 仓库的 data/ 目录修改 JSON 并提交 PR。',en:'Corrections and additions: edit the JSON under data/ in the GitHub repository and open a pull request.'},
    tier:{intro:{zh:['了解','能用正确的词描述它'],en:['Intro','describe it in the right words']},core:{zh:['掌握','能动手做并解释取舍'],en:['Core','build it and explain the trade-offs']},deep:{zh:['深入','能讨论边界、失败与替代方案'],en:['Deep','discuss limits, failures and alternatives']}},
    type:{official:{zh:'官方',en:'docs'},course:{zh:'课程',en:'course'},video:{zh:'视频',en:'video'},blog:{zh:'博客',en:'blog'},paper:{zh:'论文',en:'paper'},code:{zh:'代码',en:'code'},book:{zh:'书',en:'book'}},
    must:{zh:'必读',en:'must'}, zh:{zh:'中文',en:'zh'}, done:{zh:'已完成',en:'done'}, hours:{zh:'h',en:'h'},
    concepts:{zh:'要能说清楚的概念',en:'Concepts to be able to explain'}, questions:{zh:'自检问题',en:'Self-check questions'}, open:{zh:'开放问题',en:'Open problems'}, task:{zh:'动手任务',en:'Hands-on task'},
    trk:{job:{zh:'求职',en:'industry'},research:{zh:'科研',en:'research'},both:{zh:'',en:''}},
    learn:{zh:'学到',en:'You learn'}, all:{zh:'全部',en:'All'},
    areas:{foundations:{zh:'基础模型',en:'foundations'},reasoning:{zh:'推理',en:'reasoning'},'tool-use':{zh:'工具使用',en:'tool use'},memory:{zh:'记忆',en:'memory'},'multi-agent':{zh:'多智能体',en:'multi-agent'},coding:{zh:'编程',en:'coding'},'computer-use':{zh:'计算机操作',en:'computer use'},rl:{zh:'强化学习',en:'RL'},evals:{zh:'评估',en:'evals'},safety:{zh:'安全',en:'safety'},protocol:{zh:'协议',en:'protocol'}},
  };
  const LKEY='agent-atlas-v1';
  let state={lang:null,track:'both',done:{},filters:{},area:'all'};
  try{const s=localStorage.getItem(LKEY); if(s) state=Object.assign(state,JSON.parse(s));}catch(e){}
  const q=new URLSearchParams(location.search).get('lang'); if(q==='zh'||q==='en') state.lang=q;
  if(!state.lang) state.lang=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en';
  const save=()=>{try{localStorage.setItem(LKEY,JSON.stringify(state));}catch(e){}};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const L=()=>state.lang; const T=o=>o?(o[L()]??o.en??''):'';
  const idOf=u=>'r_'+u.replace(/[^a-z0-9]/gi,'_').slice(-80);
  const resByTopic={}; D.resources.forEach(r=>(resByTopic[r.topic]=resByTopic[r.topic]||[]).push(r));

  function render(){
    document.documentElement.lang = L()==='zh'?'zh-CN':'en';
    document.documentElement.dataset.lang=L();
    document.querySelectorAll('[data-i]').forEach(el=>{const v=UI[el.dataset.i]; if(v) el.innerHTML=T(v);});
    document.querySelectorAll('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L()));
    document.title='Agent Atlas';
    // landscape
    document.getElementById('mapIntro').textContent=T(D.landscape.intro);
    const layers=D.landscape.layers.filter(l=>!l.side), side=D.landscape.layers.find(l=>l.side);
    document.getElementById('layers').innerHTML=layers.map((l,i)=>`<div class="layer"><div class="ln">${esc(T(l.name))}</div><div class="nodes">${l.nodes.map(n=>`<a class="node" href="#${n.mod}">${esc(T(n.label))}</a>`).join('')}</div></div>${i<layers.length-1?'<div class="arrow">▲</div>':''}`).join('');
    document.getElementById('sideLayer').innerHTML=`<div class="ln">${esc(T(side.name))}</div>`+side.nodes.map(n=>`<a class="node" href="#${n.mod}">${esc(T(n.label))}</a>`).join('');
    // stages
    let html='';
    D.stages.forEach(s=>{
      html+=`<div class="stage" id="${s.id}"><div class="stage-h"><h3>${esc(T(s.name))}</h3><span class="wk">${esc(T(s.weeks))}</span><p>${esc(T(s.note))}</p></div>`;
      s.modules.forEach(k=>{
        const m=D.modules[k]; const rs=resByTopic[k]||[];
        html+=`<article class="module" id="${k}" data-mod="${k}" data-track="${m.track}">
          <div class="mod-h"><h4>${esc(T(m.title))}</h4><span class="en">${esc(L()==='zh'?m.title.en:m.title.zh)}</span>${m.track!=='both'?`<span class="tr ${m.track}">${esc(T(UI.trk[m.track]))}</span>`:''}<span class="mp" data-modprog="${k}"></span></div>
          <p class="why">${esc(T(m.why))}</p>
          <div class="cols"><div class="box"><h5>${esc(T(UI.concepts))}</h5><ul>${m.concepts.map(c=>`<li>${esc(T(c))}</li>`).join('')}</ul></div>
          <div class="box q"><h5>${esc(T(UI.questions))}</h5><ul>${m.questions.map(c=>`<li>${esc(T(c))}</li>`).join('')}</ul></div></div>
          ${m.open?`<div class="open"><h5>${esc(T(UI.open))}</h5><ul>${m.open.map(c=>`<li>${esc(T(c))}</li>`).join('')}</ul></div>`:''}`;
        ['intro','core','deep'].forEach(lv=>{
          const list=rs.filter(r=>r.level===lv); if(!list.length) return;
          const tt=UI.tier[lv][L()];
          html+=`<div class="tier" data-tier="${lv}"><div class="tier-h"><span class="dot" style="background:var(--l${lv==='intro'?1:lv==='core'?2:3})"></span><b>${tt[0]}</b><span>${tt[1]}</span></div>`;
          list.forEach(r=>{const id=idOf(r.url);
            html+=`<div class="res" data-id="${id}" data-level="${r.level}" data-type="${r.type}" data-lang="${r.lang}" data-track="${r.track}" data-must="${r.must?1:0}" data-hours="${r.hours}">
              <input type="checkbox" id="${id}" aria-label="${esc(T(UI.done))} ${esc(r.title)}">
              <div><div class="t"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="tag">${esc(T(UI.type[r.type]||{en:r.type}))}</span><span class="tag h">${r.hours} h</span>${r.must?`<span class="tag pin">${esc(T(UI.must))}</span>`:''}${r.lang==='zh'?`<span class="tag zh">${esc(T(UI.zh))}</span>`:''}</div><p class="w">${esc(T(r.why))}</p></div></div>`;
          });
          html+='</div>';
        });
        html+=`<div class="task"><b>${esc(T(UI.task))}</b>${esc(T(m.task))}</div></article>`;
      });
      html+='</div>';
    });
    document.getElementById('stages').innerHTML=html;
    // timeline
    const areas=['all',...Array.from(new Set(D.papers.map(p=>p.area)))];
    document.getElementById('areaCtl').innerHTML=areas.map(a=>`<button class="chip" data-area="${a}" aria-pressed="${state.area===a}">${a==='all'?esc(T(UI.all)):esc(T(UI.areas[a]||{en:a}))}</button>`).join('');
    const byYear={}; D.papers.forEach(p=>(byYear[p.date.slice(0,4)]=byYear[p.date.slice(0,4)]||[]).push(p));
    document.getElementById('timeline').innerHTML=Object.keys(byYear).sort().map(y=>`<div class="year" data-year="${y}"><div class="y">${y}<small>${byYear[y].length} papers</small></div><div>${byYear[y].map(p=>`<div class="paper" data-area="${p.area}"><span class="d">${p.date.slice(5)}</span><div><a class="pt" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a><span class="area">${esc(T(UI.areas[p.area]||{en:p.area}))}</span><span class="pa">${esc(p.authors)}</span><p class="pw">${esc(T(p.why))}</p></div></div>`).join('')}</div></div>`).join('');
    // projects
    document.getElementById('ladder').innerHTML=D.projects.map(p=>`<div class="rung"><span class="lv">${esc(T(p.level))}</span><h4>${esc(T(p.name))}</h4><p>${esc(T(p.desc))}</p><p class="learn">${esc(T(UI.learn))}: ${esc(T(p.learn))}</p><div class="links">${p.mods.map(k=>`<a href="#${k}">${esc(T(D.modules[k].title))}</a>`).join('')}</div></div>`).join('');
    document.getElementById('steps').innerHTML=D.research_path.map(s=>`<li>${esc(T(s))}</li>`).join('');
    document.getElementById('checklist').innerHTML='<ul>'+D.checklist.map((c,i)=>`<li><input type="checkbox" id="c_${i}" data-final="c_${i}"><label for="c_${i}">${esc(T(c))}</label></li>`).join('')+'</ul>';
    document.getElementById('sMods').textContent=Object.keys(D.modules).length;
    document.getElementById('sRes').textContent=D.resources.length;
    document.getElementById('sPapers').textContent=D.papers.length;
    document.getElementById('sMust').textContent=Math.round(D.resources.filter(r=>r.must).reduce((a,r)=>a+r.hours,0))+' h';
    refresh();
  }

  function refresh(){
    const all=Array.from(document.querySelectorAll('.res'));
    let done=0,doneH=0; const perMod={}; const f=state.filters;
    all.forEach(el=>{
      const d=!!state.done[el.dataset.id]; el.querySelector('input').checked=d; el.classList.toggle('done',d);
      const mod=el.closest('.module').dataset.mod; perMod[mod]=perMod[mod]||{d:0,t:0}; perMod[mod].t++;
      if(d){done++;doneH+=parseFloat(el.dataset.hours);perMod[mod].d++;}
      let show=true;
      if(f.must&&el.dataset.must!=='1') show=false;
      const lv=Object.keys(f).filter(k=>k.startsWith('level:')&&f[k]).map(k=>k.slice(6)); if(lv.length&&!lv.includes(el.dataset.level)) show=false;
      const ty=Object.keys(f).filter(k=>k.startsWith('type:')&&f[k]).map(k=>k.slice(5)); if(ty.length&&!ty.includes(el.dataset.type)) show=false;
      if(f['lang:zh']&&el.dataset.lang!=='zh') show=false;
      if(f.hideDone&&d) show=false;
      if(state.track!=='both'&&el.dataset.track!=='both'&&el.dataset.track!==state.track) show=false;
      el.hidden=!show;
    });
    document.querySelectorAll('.tier').forEach(t=>t.classList.toggle('empty',!t.querySelector('.res:not([hidden])')));
    document.querySelectorAll('.module').forEach(m=>m.classList.toggle('dim',state.track!=='both'&&m.dataset.track!=='both'&&m.dataset.track!==state.track));
    const total=all.length, totalH=all.reduce((a,el)=>a+parseFloat(el.dataset.hours),0);
    document.getElementById('pDone').textContent=`${done} / ${total} ${T(UI.done)}`;
    document.getElementById('pHours').textContent=`${doneH.toFixed(1)} / ${totalH.toFixed(0)} h`;
    document.getElementById('pBar').style.width=(total?done/total*100:0)+'%';
    Object.keys(perMod).forEach(k=>{const el=document.querySelector(`[data-modprog="${k}"]`); if(el) el.textContent=`${perMod[k].d} / ${perMod[k].t}`;});
    document.querySelectorAll('[data-final]').forEach(cb=>cb.checked=!!state.done[cb.dataset.final]);
    document.querySelectorAll('#controls .chip').forEach(b=>b.setAttribute('aria-pressed',!!f[b.dataset.f]));
    document.querySelectorAll('#trackSel .track').forEach(b=>b.setAttribute('aria-pressed',b.dataset.track===state.track));
    document.querySelectorAll('#areaCtl .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.area===state.area));
    document.querySelectorAll('.paper').forEach(p=>p.hidden=state.area!=='all'&&p.dataset.area!==state.area);
    document.querySelectorAll('.year').forEach(y=>y.classList.toggle('empty',!y.querySelector('.paper:not([hidden])')));
  }

  document.addEventListener('change',e=>{const cb=e.target; if(cb.type!=='checkbox') return; const key=cb.dataset.final||cb.closest('.res')?.dataset.id; if(!key) return; if(cb.checked) state.done[key]=1; else delete state.done[key]; save(); refresh();});
  document.getElementById('controls').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return; state.filters[b.dataset.f]=!state.filters[b.dataset.f]; save(); refresh();});
  document.getElementById('trackSel').addEventListener('click',e=>{const b=e.target.closest('.track'); if(!b) return; state.track=b.dataset.track; save(); refresh();});
  document.getElementById('areaCtl').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return; state.area=b.dataset.area; save(); refresh();});
  document.getElementById('langSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; state.lang=b.dataset.lang; save(); render();});
  render();
})();
</script>
</body>
</html>
